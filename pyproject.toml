[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-vaccine-sentiment"
version = "1.0.0"
description = "Sentiment Analysis of Microblog Posts on Attitude Towards Vaccination Since the Distribution of COVID-19 Vaccines"
authors = [
    { name = "Navaneeth Tanuboddi", email = "navaneeth1324@gmail.com" },
    { name = "Krrish P Raju", email = "krrish.prabu@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "PyMuPDF>=1.23.0",
    "sentence-transformers>=2.2.0"
]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
